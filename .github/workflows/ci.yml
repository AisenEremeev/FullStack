name: Full Stack labs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: [lab2, lab3, lab4, lab5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: mvn -B -ntp -f ${{ matrix.lab }}/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.lab }}-reports
          path: |
            ${{ matrix.lab }}/target/surefire-reports/
            ${{ matrix.lab }}/target/failsafe-reports/
            ${{ matrix.lab }}/target/site/jacoco/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lab6/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lab6-dist
          path: lab6/dist/
